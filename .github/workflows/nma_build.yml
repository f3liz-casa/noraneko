# SPDX-License-Identifier: MPL-2.0

name: "(A) 🔐 Build & Sign NMA"

on:
  workflow_dispatch:
    inputs:
      version:
        description: "Noraneko version"
        required: true
        type: string
      channel:
        description: "Update channel"
        required: true
        type: choice
        options:
          - nightly
          - beta
          - release
        default: nightly
  push:
    branches:
      - main
    paths:
      - 'browser-features/**'
      - 'bridge/**'

permissions:
  contents: write
  id-token: write  # Required for Sigstore OIDC

run-name: "🔐 Build NMA ${{ inputs.version || 'dev' }} (${{ inputs.channel || 'nightly' }})"

jobs:
  build-nma:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Deno
        uses: denoland/setup-deno@v2
        with:
          deno-version: v2.x

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install dependencies
        run: deno install --allow-scripts

      - name: Install Cosign
        uses: sigstore/cosign-installer@v3
        with:
          cosign-release: 'v2.2.4'

      - name: Build browser-features
        run: |
          cd browser-features/chrome
          deno run -A vite build --base chrome://noraneko/content

      - name: Write version files
        run: deno task feles-build misc writeVersion

      - name: Determine version
        id: version
        run: |
          if [ -n "${{ inputs.version }}" ]; then
            echo "version=${{ inputs.version }}" >> $GITHUB_OUTPUT
          else
            # Extract version from static/gecko/config/version.txt or package.json
            if [ -f static/gecko/config/version.txt ]; then
              VERSION=$(cat static/gecko/config/version.txt)
            else
              VERSION=$(jq -r '.version' package.json)
            fi
            echo "version=${VERSION}" >> $GITHUB_OUTPUT
          fi
          
          CHANNEL="${{ inputs.channel }}"
          if [ -z "$CHANNEL" ]; then
            CHANNEL="nightly"
          fi
          echo "channel=${CHANNEL}" >> $GITHUB_OUTPUT

      - name: Build NMA
        run: |
          deno task nma:build \
            --source browser-features/chrome/_dist \
            --output noraneko.nma.zip \
            --version ${{ steps.version.outputs.version }} \
            --channel ${{ steps.version.outputs.channel }} \
            --commit ${{ github.sha }}

      - name: Sign NMA manifest
        id: sign
        env:
          COSIGN_EXPERIMENTAL: 1
        run: |
          # Extract manifest from NMA
          unzip -p noraneko.nma.zip manifest.json > manifest-unsigned.json
          
          # Sign the manifest using keyless signing
          cosign sign-blob \
            --yes \
            --oidc-issuer https://token.actions.githubusercontent.com \
            --bundle signature-bundle.json \
            manifest-unsigned.json
          
          echo "✅ NMA manifest signed"
          
          # Read signature bundle and encode (fixed UUOC)
          BUNDLE=$(base64 -w 0 < signature-bundle.json)
          TIMESTAMP=$(date -u +"%Y-%m-%dT%H:%M:%SZ")
          
          # Extract Rekor log ID
          REKOR_LOG_ID=$(jq -r '.verificationMaterial.tlogEntries[0].logId.keyId // "unknown"' signature-bundle.json)
          
          # Security: Use fixed branch reference for production
          # This ensures signatures are tied to the specific workflow run
          WORKFLOW_REF=".github/workflows/nma_build.yml@${{ github.sha }}"
          
          # Update manifest with signature
          jq --arg bundle "$BUNDLE" \
             --arg rekorLogId "$REKOR_LOG_ID" \
             --arg signedAt "$TIMESTAMP" \
             --arg issuer "https://token.actions.githubusercontent.com" \
             --arg subject "https://github.com/${{ github.repository }}/.github/workflows/nma_build.yml@${{ github.sha }}" \
             --arg repository "${{ github.repository }}" \
             --arg workflowRef "$WORKFLOW_REF" \
             '.sigstoreBundle = {
               "bundle": $bundle,
               "signerIdentity": {
                 "issuer": $issuer,
                 "subject": $subject,
                 "repository": $repository,
                 "workflowRef": $workflowRef
               },
               "rekorLogId": $rekorLogId,
               "signedAt": $signedAt
             }' manifest-unsigned.json > manifest.json
          
          echo "rekor_log_id=${REKOR_LOG_ID}" >> $GITHUB_OUTPUT

      - name: Rebuild NMA with signed manifest
        run: |
          # Create temp directory and extract NMA
          mkdir -p nma-temp
          unzip -q noraneko.nma.zip -d nma-temp
          
          # Replace manifest with signed version
          cp manifest.json nma-temp/manifest.json
          cp signature-bundle.json nma-temp/signature-bundle.json
          
          # Rebuild the archive
          rm noraneko.nma.zip
          cd nma-temp
          zip -r -9 ../noraneko.nma.zip .
          cd ..
          
          # Cleanup
          rm -rf nma-temp manifest-unsigned.json

      - name: Verify NMA signature
        env:
          COSIGN_EXPERIMENTAL: 1
        run: |
          # Extract and verify
          unzip -p noraneko.nma.zip manifest.json > verify-manifest.json
          
          cosign verify-blob \
            --bundle signature-bundle.json \
            --certificate-identity-regexp ".*" \
            --certificate-oidc-issuer https://token.actions.githubusercontent.com \
            verify-manifest.json
          
          echo "✅ NMA signature verified"
          rm verify-manifest.json

      - name: Compute NMA hash
        id: hash
        run: |
          HASH=$(sha256sum noraneko.nma.zip | cut -d' ' -f1)
          echo "hash=${HASH}" >> $GITHUB_OUTPUT
          echo "NMA hash: ${HASH}"

      - name: Upload NMA artifact
        uses: actions/upload-artifact@v4
        with:
          name: noraneko-nma-${{ steps.version.outputs.channel }}
          path: |
            noraneko.nma.zip
            signature-bundle.json
            manifest.json
          compression-level: 0

      - name: Output summary
        run: |
          echo "## 🔐 NMA Built and Signed" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "| Property | Value |" >> $GITHUB_STEP_SUMMARY
          echo "|----------|-------|" >> $GITHUB_STEP_SUMMARY
          echo "| **Version** | \`${{ steps.version.outputs.version }}\` |" >> $GITHUB_STEP_SUMMARY
          echo "| **Channel** | \`${{ steps.version.outputs.channel }}\` |" >> $GITHUB_STEP_SUMMARY
          echo "| **Commit** | \`${{ github.sha }}\` |" >> $GITHUB_STEP_SUMMARY
          echo "| **SHA-256** | \`${{ steps.hash.outputs.hash }}\` |" >> $GITHUB_STEP_SUMMARY
          echo "| **Rekor Log ID** | \`${{ steps.sign.outputs.rekor_log_id }}\` |" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "### 📦 Distribution" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "The NMA file (\`noraneko.nma.zip\`) should be placed in the Firefox installation directory alongside \`omni.ja\`." >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "For Windows updates, use [noraneko-winupdater](https://github.com/f3liz-dev/noraneko-winupdater) to download and verify the NMA." >> $GITHUB_STEP_SUMMARY
