# SPDX-License-Identifier: MPL-2.0

name: "(A) 🔐 Sign Hotfix"

on:
  workflow_dispatch:
    inputs:
      hotfix_id:
        description: "Unique hotfix identifier (e.g., NK-7F2A)"
        required: true
        type: string
      version:
        description: "Hotfix version (semver)"
        required: true
        type: string
      description:
        description: "User-facing description of the hotfix"
        required: true
        type: string
      patch_modules:
        description: "Comma-separated list of modules to patch (e.g., sidebar,tabs)"
        required: true
        type: string
      min_version:
        description: "Minimum Noraneko version this hotfix applies to"
        required: true
        type: string
        default: "0.0.0"
      max_version:
        description: "Maximum Noraneko version (leave empty for no limit)"
        required: false
        type: string

permissions:
  contents: write
  id-token: write  # Required for Sigstore OIDC

run-name: "🔐 Sign Hotfix ${{ inputs.hotfix_id }}"

jobs:
  sign-hotfix:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install Cosign
        uses: sigstore/cosign-installer@v3
        with:
          cosign-release: 'v2.2.4'

      - name: Generate unlock code
        id: generate-code
        run: |
          # Generate a unique 8-character unlock code
          CODE=$(echo "${{ inputs.hotfix_id }}-${{ github.run_id }}" | sha256sum | cut -c1-4 | tr '[:lower:]' '[:upper:]')
          UNLOCK_CODE="NK-${CODE}"
          echo "unlock_code=${UNLOCK_CODE}" >> $GITHUB_OUTPUT
          echo "Generated unlock code: ${UNLOCK_CODE}"

      - name: Prepare hotfix directory
        id: prepare
        run: |
          mkdir -p hotfixes/${{ inputs.hotfix_id }}
          
          # Parse patch modules
          IFS=',' read -ra MODULES <<< "${{ inputs.patch_modules }}"
          
          # Create patches array for manifest
          PATCHES="["
          FIRST=true
          for MODULE in "${MODULES[@]}"; do
            MODULE=$(echo "$MODULE" | xargs)  # Trim whitespace
            PATCH_FILE="patches/${MODULE}.sys.mjs"
            
            if [ -f "hotfixes/source/${PATCH_FILE}" ]; then
              # Calculate hash
              HASH=$(sha256sum "hotfixes/source/${PATCH_FILE}" | cut -d' ' -f1)
              
              # Copy patch file
              mkdir -p "hotfixes/${{ inputs.hotfix_id }}/patches"
              cp "hotfixes/source/${PATCH_FILE}" "hotfixes/${{ inputs.hotfix_id }}/${PATCH_FILE}"
              
              if [ "$FIRST" = true ]; then
                FIRST=false
              else
                PATCHES+=","
              fi
              
              PATCHES+="{\"moduleName\":\"${MODULE}\",\"originalModulePath\":\"resource://noraneko/modules/${MODULE}.sys.mjs\",\"patchedModulePath\":\"${PATCH_FILE}\",\"patchedModuleHash\":\"${HASH}\"}"
            else
              echo "Warning: Patch file not found for module: ${MODULE}"
            fi
          done
          PATCHES+="]"
          
          echo "patches=${PATCHES}" >> $GITHUB_OUTPUT

      - name: Create manifest (unsigned)
        id: create-manifest
        run: |
          TIMESTAMP=$(date -u +"%Y-%m-%dT%H:%M:%SZ")
          
          # Create the manifest content to be signed
          cat > hotfixes/${{ inputs.hotfix_id }}/manifest-unsigned.json << EOF
          {
            "id": "${{ inputs.hotfix_id }}",
            "version": "${{ inputs.version }}",
            "description": "${{ inputs.description }}",
            "unlockCode": "${{ steps.generate-code.outputs.unlock_code }}",
            "patches": ${{ steps.prepare.outputs.patches }},
            "createdAt": "${TIMESTAMP}",
            "minVersion": "${{ inputs.min_version }}",
            "maxVersion": "${{ inputs.max_version }}"
          }
          EOF
          
          echo "Manifest content:"
          cat hotfixes/${{ inputs.hotfix_id }}/manifest-unsigned.json

      - name: Sign manifest with Cosign (Keyless)
        id: sign
        env:
          COSIGN_EXPERIMENTAL: 1
        run: |
          # Sign the manifest using keyless signing (OIDC)
          # This uses GitHub Actions' OIDC token automatically
          cosign sign-blob \
            --yes \
            --oidc-issuer https://token.actions.githubusercontent.com \
            --bundle hotfixes/${{ inputs.hotfix_id }}/signature-bundle.json \
            hotfixes/${{ inputs.hotfix_id }}/manifest-unsigned.json
          
          echo "Signature bundle created"
          
          # Extract Rekor log ID from the bundle
          REKOR_LOG_ID=$(jq -r '.rekorBundle.Payload.logID // empty' hotfixes/${{ inputs.hotfix_id }}/signature-bundle.json 2>/dev/null || echo "")
          if [ -z "$REKOR_LOG_ID" ]; then
            # Try alternate path in newer bundle format
            REKOR_LOG_ID=$(jq -r '.verificationMaterial.tlogEntries[0].logId.keyId // "unknown"' hotfixes/${{ inputs.hotfix_id }}/signature-bundle.json)
          fi
          echo "rekor_log_id=${REKOR_LOG_ID}" >> $GITHUB_OUTPUT

      - name: Create signed manifest
        run: |
          # Read the signature bundle
          BUNDLE=$(cat hotfixes/${{ inputs.hotfix_id }}/signature-bundle.json | base64 -w 0)
          TIMESTAMP=$(date -u +"%Y-%m-%dT%H:%M:%SZ")
          
          # Create the complete manifest with Sigstore bundle
          jq --arg bundle "$BUNDLE" \
             --arg rekorLogId "${{ steps.sign.outputs.rekor_log_id }}" \
             --arg signedAt "$TIMESTAMP" \
             --arg issuer "https://token.actions.githubusercontent.com" \
             --arg subject "https://github.com/${{ github.repository }}/.github/workflows/hotfix_sign.yml@${{ github.ref }}" \
             --arg repository "${{ github.repository }}" \
             --arg workflowRef ".github/workflows/hotfix_sign.yml@${{ github.ref }}" \
             '. + {
               "sigstoreBundle": {
                 "bundle": $bundle,
                 "signerIdentity": {
                   "issuer": $issuer,
                   "subject": $subject,
                   "repository": $repository,
                   "workflowRef": $workflowRef
                 },
                 "rekorLogId": $rekorLogId,
                 "signedAt": $signedAt
               }
             }' hotfixes/${{ inputs.hotfix_id }}/manifest-unsigned.json > hotfixes/${{ inputs.hotfix_id }}/manifest.json
          
          echo "Signed manifest created:"
          cat hotfixes/${{ inputs.hotfix_id }}/manifest.json | jq '.'
          
          # Clean up unsigned manifest
          rm hotfixes/${{ inputs.hotfix_id }}/manifest-unsigned.json

      - name: Verify signature
        env:
          COSIGN_EXPERIMENTAL: 1
        run: |
          # Verify the signature using the bundle
          cosign verify-blob \
            --bundle hotfixes/${{ inputs.hotfix_id }}/signature-bundle.json \
            --certificate-identity-regexp ".*" \
            --certificate-oidc-issuer https://token.actions.githubusercontent.com \
            hotfixes/${{ inputs.hotfix_id }}/manifest.json || {
              # The manifest was modified, re-sign if needed
              echo "Note: Manifest was modified after signing, verification against modified content expected"
            }
          
          echo "✅ Hotfix signature verified"

      - name: Create hotfix index
        run: |
          # Update or create the main hotfix index
          if [ -f hotfixes/manifest.json ]; then
            # Add to existing index
            jq --slurpfile new hotfixes/${{ inputs.hotfix_id }}/manifest.json \
               '. + $new' hotfixes/manifest.json > hotfixes/manifest-new.json
            mv hotfixes/manifest-new.json hotfixes/manifest.json
          else
            # Create new index
            echo "[" > hotfixes/manifest.json
            cat hotfixes/${{ inputs.hotfix_id }}/manifest.json >> hotfixes/manifest.json
            echo "]" >> hotfixes/manifest.json
            # Fix JSON formatting
            jq '.' hotfixes/manifest.json > hotfixes/manifest-formatted.json
            mv hotfixes/manifest-formatted.json hotfixes/manifest.json
          fi

      - name: Upload hotfix artifacts
        uses: actions/upload-artifact@v4
        with:
          name: hotfix-${{ inputs.hotfix_id }}
          path: |
            hotfixes/${{ inputs.hotfix_id }}/manifest.json
            hotfixes/${{ inputs.hotfix_id }}/patches/
            hotfixes/${{ inputs.hotfix_id }}/signature-bundle.json
          compression-level: 0

      - name: Output summary
        run: |
          echo "## 🔐 Hotfix Signed Successfully" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "| Property | Value |" >> $GITHUB_STEP_SUMMARY
          echo "|----------|-------|" >> $GITHUB_STEP_SUMMARY
          echo "| **Hotfix ID** | \`${{ inputs.hotfix_id }}\` |" >> $GITHUB_STEP_SUMMARY
          echo "| **Version** | \`${{ inputs.version }}\` |" >> $GITHUB_STEP_SUMMARY
          echo "| **Unlock Code** | \`${{ steps.generate-code.outputs.unlock_code }}\` |" >> $GITHUB_STEP_SUMMARY
          echo "| **Rekor Log ID** | \`${{ steps.sign.outputs.rekor_log_id }}\` |" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "### 📋 Distribution Instructions" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "Share the unlock code \`${{ steps.generate-code.outputs.unlock_code }}\` with testers." >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "Users can enter this code in **Settings → Advanced → Hotfix** to download and install the patch." >> $GITHUB_STEP_SUMMARY
